# docker-compose.yml

services:
  agent:
    build: .
    container_name: juanito-agent
    restart: unless-stopped
    # Sin puertos expuestos: Baileys abre una conexión saliente a WA,
    # no recibe tráfico entrante.
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-America/Bogota}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      # Modelo en grupos. Vacío = usa CLAUDE_MODEL (mismo modelo en DM y grupos).
      - CLAUDE_GROUP_MODEL=${CLAUDE_GROUP_MODEL:-}
      # Modelo SOLO para el DM del jefe (role=boss). Vacío = usa CLAUDE_MODEL. Permite
      # darle Sonnet al jefe sin encarecer admins, futuros usuarios del DM, ni grupos.
      - CLAUDE_BOSS_MODEL=${CLAUDE_BOSS_MODEL:-}
      - CLAUDE_MAX_TOKENS=${CLAUDE_MAX_TOKENS:-2048}
      - BOSS_PHONE=${BOSS_PHONE}
      # LID del jefe en WA multi-device (vacío = retrocompat: cualquier @lid no-admin = jefe).
      - BOSS_LID=${BOSS_LID:-}
      # LIDs del equipo dev con rol admin (CSV). Sin esto no hay admins.
      - ADMIN_LID=${ADMIN_LID:-}
      - BOT_NAME=${BOT_NAME:-Juanito}
      # Anti-secuestro de grupos: 'log' (default, solo registra) | 'on' (auto-leave real).
      - GROUP_AUTOLEAVE=${GROUP_AUTOLEAVE:-log}
      - AGENT_PHONE=${AGENT_PHONE}
      - DB_PATH=/app/data/brain.sqlite
      - WA_SESSION_PATH=/app/data/wa-session
      - MAX_GROUPS_PER_CYCLE=${MAX_GROUPS_PER_CYCLE:-10}
      - SUMMARY_CRON=${SUMMARY_CRON:-0 */4 * * *}
      - SUMMARY_CYCLE_HOURS=${SUMMARY_CYCLE_HOURS:-4}
      # Extracción de contexto de negocio (Fase 2B): propone hechos desde los resúmenes.
      - BIZ_EXTRACT_CRON=${BIZ_EXTRACT_CRON:-0 3 * * *}
      - BIZ_EXTRACT_SUMMARIES=${BIZ_EXTRACT_SUMMARIES:-20}
      # Hardening grupos grandes (§18.D): tope de mensajes por resumen, throttle
      # global de envío (anti-ban) y ventana de historial de grupo.
      - SUMMARY_MAX_MSGS=${SUMMARY_MAX_MSGS:-400}
      - WA_SEND_MIN_GAP_MS=${WA_SEND_MIN_GAP_MS:-1000}
      - WA_SEND_JITTER_MS=${WA_SEND_JITTER_MS:-500}
      - WA_SEND_QUEUE_MAX=${WA_SEND_QUEUE_MAX:-200}
      # Espaciado por grupo (anti-ráfaga): dos respuestas al MISMO grupo se separan
      # ≥ gap (+ jitter) → ~8-10s. No bloquea otros grupos ni DMs.
      - WA_SEND_PER_GROUP_GAP_MS=${WA_SEND_PER_GROUP_GAP_MS:-8000}
      - WA_SEND_PER_GROUP_JITTER_MS=${WA_SEND_PER_GROUP_JITTER_MS:-2000}
      # Tope de respuestas autónomas del bot por grupo por hora (las aprobadas no cuentan).
      - GROUP_REPLY_HOURLY_CAP=${GROUP_REPLY_HOURLY_CAP:-15}
      # Contexto de grupo POR TIEMPO (§18.O): ventana en minutos + tope MÁXIMO de mensajes.
      - CLAUDE_GROUP_HISTORY=${CLAUDE_GROUP_HISTORY:-100}
      - CLAUDE_GROUP_HISTORY_MINUTES=${CLAUDE_GROUP_HISTORY_MINUTES:-30}
      # Mensajes generados con aprobación (§18.F): minutos de anticipación con que
      # se genera el borrador y se le manda al jefe antes de la hora de publicar.
      - DRAFT_LEAD_MIN=${DRAFT_LEAD_MIN:-60}
      # Grupo dedicado al que se mandan las solicitudes de aprobación (borradores §18.F +
      # respuestas §18.O/J). Vacío = van al DM del jefe. group_id (…@g.us) o nombre del grupo.
      - APPROVALS_GROUP=${APPROVALS_GROUP:-}
      # Aprobación de respuestas en grupos: minutos que una respuesta retenida espera
      # el visto bueno del jefe antes de RESCATARSE (avisa al remitente + el jefe puede
      # aún aprobarla con "apruebo #id"). §18.O
      - REPLY_APPROVAL_TTL_MIN=${REPLY_APPROVAL_TTL_MIN:-30}
      - REPLY_EXPIRY_NOTICE=${REPLY_EXPIRY_NOTICE:-}
      # Ventana de descanso/sueño (§18.O): dentro de ella NO se molesta al jefe con
      # aprobaciones (quedan en cola → digest al volver el horario laboral) y al remitente
      # se le avisa. Vacío = sin ventana (apagado). HH:MM en la TZ del bot, cruza medianoche.
      - QUIET_HOURS_START=${QUIET_HOURS_START:-}
      - QUIET_HOURS_END=${QUIET_HOURS_END:-}
      - QUIET_HOURS_NOTICE=${QUIET_HOURS_NOTICE:-}
      # Rate limit en grupos (antes faltaban en environment: → no llegaban al contenedor).
      - GROUP_DAILY_LIMIT=${GROUP_DAILY_LIMIT:-5}
      - UNLIMITED_PHONES=${UNLIMITED_PHONES:-}
      # Calendly precall pushes — sin estas vars el job arranca desactivado.
      # DRY_RUN y REQUIRE_OPTIN quedan en su default seguro (true) si no se setean.
      - CALENDLY_TOKEN=${CALENDLY_TOKEN}
      - CALENDLY_DRY_RUN=${CALENDLY_DRY_RUN:-true}
      - CALENDLY_REQUIRE_OPTIN=${CALENDLY_REQUIRE_OPTIN:-true}
      - CALENDLY_EVENT_TYPES=${CALENDLY_EVENT_TYPES:-}
      - CALENDLY_GROUP_URI=${CALENDLY_GROUP_URI:-}
      - CALENDLY_ORG_URI=${CALENDLY_ORG_URI:-}
      - CALENDLY_PUSH3_LEAD_MIN=${CALENDLY_PUSH3_LEAD_MIN:-25}
      - CALENDLY_PUSH1_CRON=${CALENDLY_PUSH1_CRON:-0 19 * * *}
      - CALENDLY_PUSH2_CRON=${CALENDLY_PUSH2_CRON:-30 6 * * *}
      - CALENDLY_POLL_CRON=${CALENDLY_POLL_CRON:-*/5 * * * *}
      - CALENDLY_PUSH0_ENABLED=${CALENDLY_PUSH0_ENABLED:-true}
      - CALENDLY_PUSH0_RECENT_MIN=${CALENDLY_PUSH0_RECENT_MIN:-10}
      # Registro de outcomes post-call (§18.AB): Push 4 = Juanito pregunta el estado
      # de la call ~5 min después de terminar y lo guarda. CALENDLY_PUSH4_CLOSERS es un
      # allowlist (CSV de emails) para rollout acotado — VACÍO = todos los closers.
      - CALENDLY_PUSH4_ENABLED=${CALENDLY_PUSH4_ENABLED:-true}
      - CALENDLY_PUSH4_CLOSERS=${CALENDLY_PUSH4_CLOSERS:-}
      - CALENDLY_CALL_DURATION_MIN=${CALENDLY_CALL_DURATION_MIN:-30}
      - CALENDLY_PUSH4_GRACE_MIN=${CALENDLY_PUSH4_GRACE_MIN:-5}
      - CALENDLY_OUTCOME_REMIND_MIN=${CALENDLY_OUTCOME_REMIND_MIN:-30}
      - CALENDLY_OUTCOME_EXPIRE_MIN=${CALENDLY_OUTCOME_EXPIRE_MIN:-30}
      - CALENDLY_OUTCOME_CRON=${CALENDLY_OUTCOME_CRON:-*/10 * * * *}
      # Reporte diario de leads del Sheet (§18.B) — sin GOOGLE_SA_KEY o grupo el job se autodesactiva.
      - GOOGLE_SA_KEY=${GOOGLE_SA_KEY:-}
      - SHEETS_REPORT_GROUP=${SHEETS_REPORT_GROUP:-}
      - SHEETS_LEADS_ID=${SHEETS_LEADS_ID:-}
      - SHEETS_LEADS_TAB=${SHEETS_LEADS_TAB:-}
      - SHEETS_REPORT_CRON=${SHEETS_REPORT_CRON:-0 20 * * *}
      - SHEETS_SRC_AHEAD_HOURS=${SHEETS_SRC_AHEAD_HOURS:-3}
      # Reporte diario de MÉTRICAS de desempeño por DM (§18.N) — sin ID/TAB/recipients el job se autodesactiva.
      - SHEETS_METRICS_ID=${SHEETS_METRICS_ID:-}
      - SHEETS_METRICS_TAB=${SHEETS_METRICS_TAB:-}
      # Cada sección a su grupo (ya no por DM). Sin estos el job se autodesactiva.
      - SHEETS_METRICS_30X_GROUP=${SHEETS_METRICS_30X_GROUP:-}
      - SHEETS_METRICS_ESTADOX_GROUP=${SHEETS_METRICS_ESTADOX_GROUP:-}
      - SHEETS_METRICS_LINKEDIN_GROUP=${SHEETS_METRICS_LINKEDIN_GROUP:-}
      - SHEETS_METRICS_CRON=${SHEETS_METRICS_CRON:-0 20 * * *}
      # Reporte diario de "Registro de calls" (§18.AB) desde call_outcomes → grupo por
      # programa. ENABLED=false lo apaga (ej: durante un test acotado a un closer).
      - OUTCOME_REPORT_ENABLED=${OUTCOME_REPORT_ENABLED:-true}
      - OUTCOME_REPORT_CRON=${OUTCOME_REPORT_CRON:-0 22 * * *}
      # Setteo a leads que no agendaron (§18.AD) — Cloud API oficial (Twilio) en número
      # DEDICADO. Sin credenciales Twilio o sin GOOGLE_SA_KEY el job se autodesactiva.
      # Arranca en DRY_RUN por default (no envía). Ver docs/SETTEO-SETUP.md.
      - SETTING_DRY_RUN=${SETTING_DRY_RUN:-true}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WA_FROM=${TWILIO_WA_FROM:-}
      - SETTING_TEMPLATE_ABOGADOS_TOUCH1=${SETTING_TEMPLATE_ABOGADOS_TOUCH1:-}
      - SETTING_TEMPLATE_ABOGADOS_TOUCH2=${SETTING_TEMPLATE_ABOGADOS_TOUCH2:-}
      - SETTING_CRON=${SETTING_CRON:-*/10 * * * *}
      - SETTING_ENROLL_MAX_AGE_H=${SETTING_ENROLL_MAX_AGE_H:-48}
      - SETTING_TOUCH1_DELAY_MIN=${SETTING_TOUCH1_DELAY_MIN:-120}
      - SETTING_TOUCH2_DELAY_MIN=${SETTING_TOUCH2_DELAY_MIN:-2880}
      - SETTING_DEFAULT_CC=${SETTING_DEFAULT_CC:-57}
      # QR web server — solo durante la vinculación inicial.
      # Descomentar la línea de abajo y agregar QR_PORT=3001 al .env.
      # Volver a comentar una vez vinculado.
      # - QR_PORT=${QR_PORT:-}
    # ports:
    #   - "${QR_PORT:-3001}:${QR_PORT:-3001}"
    volumes:
      - agent-data:/app/data

volumes:
  agent-data:
    driver: local
