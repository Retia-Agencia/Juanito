# docker-compose.yml

services:
  agent:
    build: .
    container_name: juanito-agent
    restart: unless-stopped
    # Sin puertos expuestos: Baileys abre una conexión saliente a WA,
    # no recibe tráfico entrante.
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-America/Bogota}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      # Modelo en grupos. Vacío = usa CLAUDE_MODEL (mismo modelo en DM y grupos).
      - CLAUDE_GROUP_MODEL=${CLAUDE_GROUP_MODEL:-}
      # Modelo SOLO para el DM del jefe (role=boss). Vacío = usa CLAUDE_MODEL. Permite
      # darle Sonnet al jefe sin encarecer admins, futuros usuarios del DM, ni grupos.
      - CLAUDE_BOSS_MODEL=${CLAUDE_BOSS_MODEL:-}
      - CLAUDE_MAX_TOKENS=${CLAUDE_MAX_TOKENS:-2048}
      - BOSS_PHONE=${BOSS_PHONE}
      # LID del jefe en WA multi-device (vacío = retrocompat: cualquier @lid no-admin = jefe).
      - BOSS_LID=${BOSS_LID:-}
      # LIDs del equipo dev con rol admin (CSV). Sin esto no hay admins.
      - ADMIN_LID=${ADMIN_LID:-}
      - BOT_NAME=${BOT_NAME:-Juanito}
      # Anti-secuestro de grupos: 'log' (default, solo registra) | 'on' (auto-leave real).
      - GROUP_AUTOLEAVE=${GROUP_AUTOLEAVE:-log}
      - AGENT_PHONE=${AGENT_PHONE}
      - DB_PATH=/app/data/brain.sqlite
      - WA_SESSION_PATH=/app/data/wa-session
      - MAX_GROUPS_PER_CYCLE=${MAX_GROUPS_PER_CYCLE:-10}
      - SUMMARY_CRON=${SUMMARY_CRON:-0 */4 * * *}
      - SUMMARY_CYCLE_HOURS=${SUMMARY_CYCLE_HOURS:-4}
      # Extracción de contexto de negocio (Fase 2B): propone hechos desde los resúmenes.
      - BIZ_EXTRACT_CRON=${BIZ_EXTRACT_CRON:-0 3 * * *}
      - BIZ_EXTRACT_SUMMARIES=${BIZ_EXTRACT_SUMMARIES:-20}
      # Hardening grupos grandes (§18.D): tope de mensajes por resumen, throttle
      # global de envío (anti-ban) y ventana de historial de grupo.
      - SUMMARY_MAX_MSGS=${SUMMARY_MAX_MSGS:-400}
      - WA_SEND_MIN_GAP_MS=${WA_SEND_MIN_GAP_MS:-1000}
      - WA_SEND_JITTER_MS=${WA_SEND_JITTER_MS:-500}
      - WA_SEND_QUEUE_MAX=${WA_SEND_QUEUE_MAX:-200}
      # Espaciado por grupo (anti-ráfaga): dos respuestas al MISMO grupo se separan
      # ≥ gap (+ jitter) → ~8-10s. No bloquea otros grupos ni DMs.
      - WA_SEND_PER_GROUP_GAP_MS=${WA_SEND_PER_GROUP_GAP_MS:-8000}
      - WA_SEND_PER_GROUP_JITTER_MS=${WA_SEND_PER_GROUP_JITTER_MS:-2000}
      # Tope de respuestas autónomas del bot por grupo por hora (las aprobadas no cuentan).
      - GROUP_REPLY_HOURLY_CAP=${GROUP_REPLY_HOURLY_CAP:-15}
      # Contexto de grupo POR TIEMPO (§18.O): ventana en minutos + tope MÁXIMO de mensajes.
      - CLAUDE_GROUP_HISTORY=${CLAUDE_GROUP_HISTORY:-100}
      - CLAUDE_GROUP_HISTORY_MINUTES=${CLAUDE_GROUP_HISTORY_MINUTES:-30}
      # Mensajes generados con aprobación (§18.F): minutos de anticipación con que
      # se genera el borrador y se le manda al jefe antes de la hora de publicar.
      - DRAFT_LEAD_MIN=${DRAFT_LEAD_MIN:-60}
      # Grupo dedicado al que se mandan las solicitudes de aprobación (borradores §18.F +
      # respuestas §18.O/J). Vacío = van al DM del jefe. group_id (…@g.us) o nombre del grupo.
      - APPROVALS_GROUP=${APPROVALS_GROUP:-}
      # Aprobación de respuestas en grupos: minutos que una respuesta retenida espera
      # el visto bueno del jefe antes de RESCATARSE (avisa al remitente + el jefe puede
      # aún aprobarla con "apruebo #id"). §18.O
      - REPLY_APPROVAL_TTL_MIN=${REPLY_APPROVAL_TTL_MIN:-30}
      - REPLY_EXPIRY_NOTICE=${REPLY_EXPIRY_NOTICE:-}
      # Ventana de descanso/sueño (§18.O): dentro de ella NO se molesta al jefe con
      # aprobaciones (quedan en cola → digest al volver el horario laboral) y al remitente
      # se le avisa. Vacío = sin ventana (apagado). HH:MM en la TZ del bot, cruza medianoche.
      - QUIET_HOURS_START=${QUIET_HOURS_START:-}
      - QUIET_HOURS_END=${QUIET_HOURS_END:-}
      - QUIET_HOURS_NOTICE=${QUIET_HOURS_NOTICE:-}
      # Rate limit en grupos (antes faltaban en environment: → no llegaban al contenedor).
      - GROUP_DAILY_LIMIT=${GROUP_DAILY_LIMIT:-5}
      - UNLIMITED_PHONES=${UNLIMITED_PHONES:-}
      # Calendly precall pushes — sin estas vars el job arranca desactivado.
      # DRY_RUN y REQUIRE_OPTIN quedan en su default seguro (true) si no se setean.
      - CALENDLY_TOKEN=${CALENDLY_TOKEN}
      - CALENDLY_DRY_RUN=${CALENDLY_DRY_RUN:-true}
      - CALENDLY_REQUIRE_OPTIN=${CALENDLY_REQUIRE_OPTIN:-true}
      - CALENDLY_EVENT_TYPES=${CALENDLY_EVENT_TYPES:-}
      - CALENDLY_GROUP_URI=${CALENDLY_GROUP_URI:-}
      - CALENDLY_ORG_URI=${CALENDLY_ORG_URI:-}
      - CALENDLY_PUSH3_LEAD_MIN=${CALENDLY_PUSH3_LEAD_MIN:-25}
      - CALENDLY_PUSH1_CRON=${CALENDLY_PUSH1_CRON:-0 19 * * *}
      - CALENDLY_PUSH2_CRON=${CALENDLY_PUSH2_CRON:-30 6 * * *}
      - CALENDLY_SKIP_AUDIT_CRON=${CALENDLY_SKIP_AUDIT_CRON:-15 * * * *}
      - CALENDLY_SKIP_ALERT_MIN=${CALENDLY_SKIP_ALERT_MIN:-2}
      - CALENDLY_POLL_CRON=${CALENDLY_POLL_CRON:-*/5 * * * *}
      - CALENDLY_PUSH0_ENABLED=${CALENDLY_PUSH0_ENABLED:-true}
      - CALENDLY_PUSH0_RECENT_MIN=${CALENDLY_PUSH0_RECENT_MIN:-10}
      # Registro de outcomes post-call (§18.AB): Push 4 = Juanito pregunta el estado
      # de la call ~5 min después de terminar y lo guarda. CALENDLY_PUSH4_CLOSERS es un
      # allowlist (CSV de emails) para rollout acotado — VACÍO = todos los closers.
      - CALENDLY_PUSH4_ENABLED=${CALENDLY_PUSH4_ENABLED:-true}
      - CALENDLY_PUSH4_CLOSERS=${CALENDLY_PUSH4_CLOSERS:-}
      - CALENDLY_CALL_DURATION_MIN=${CALENDLY_CALL_DURATION_MIN:-30}
      - CALENDLY_PUSH4_GRACE_MIN=${CALENDLY_PUSH4_GRACE_MIN:-5}
      - CALENDLY_OUTCOME_REMIND_MIN=${CALENDLY_OUTCOME_REMIND_MIN:-30}
      - CALENDLY_OUTCOME_EXPIRE_MIN=${CALENDLY_OUTCOME_EXPIRE_MIN:-30}
      - CALENDLY_OUTCOME_CRON=${CALENDLY_OUTCOME_CRON:-*/10 * * * *}
      # Reagendas (§18.AC): con "3 · Reagendó", Juanito pide la fecha nueva y agenda la call
      # por su cuenta (uuid sintético 'manual:…'), venga o no de Calendly. Evita el doble
      # conteo y hace visibles las reagendas por otro link. APAGADO por default: se prende
      # junto con el allowlist de CALENDLY_PUSH4_CLOSERS.
      - CALENDLY_RESCHEDULE_ENABLED=${CALENDLY_RESCHEDULE_ENABLED:-false}
      - CALENDLY_RESCHEDULE_PROMPT_CRON=${CALENDLY_RESCHEDULE_PROMPT_CRON:-0 9 * * *}
      - CALENDLY_RESCHEDULE_MAX_ASKED=${CALENDLY_RESCHEDULE_MAX_ASKED:-3}
      - CALENDLY_RESCHEDULE_MAX_CHAIN=${CALENDLY_RESCHEDULE_MAX_CHAIN:-3}
      # Fallback a Claude solo si el parser regex no entiende la fecha.
      - CALENDLY_RESCHEDULE_AI=${CALENDLY_RESCHEDULE_AI:-true}
      - CALENDLY_RESCHEDULE_MODEL=${CALENDLY_RESCHEDULE_MODEL:-}
      - CALENDLY_RESCHEDULE_AI_TIMEOUT_MS=${CALENDLY_RESCHEDULE_AI_TIMEOUT_MS:-8000}
      # Cuenta Retia (agencia #2, programa "De Cero a Tactical Investor"). El registro pasa env
      # EXPLÍCITAMENTE → sin estas líneas el token del .env NO llega al contenedor y retia no entra
      # a activeAccounts(). Org URI y event_type van hardcodeados en accounts.js (no por env).
      - CALENDLY_TOKEN_RETIA=${CALENDLY_TOKEN_RETIA:-}
      - CALENDLY_DRY_RUN_RETIA=${CALENDLY_DRY_RUN_RETIA:-true}
      # Push 5 (§18.AP): recordatorio de llenar los Sheets, N min después de que TERMINA la
      # call. Solo lo reciben las conexiones que declaran `sheets` en accounts.js (hoy retia),
      # así que este flag es el apagado de emergencia, no el interruptor de alcance.
      - CALENDLY_SHEET_PUSH=${CALENDLY_SHEET_PUSH:-true}
      - CALENDLY_SHEET_DELAY_MIN=${CALENDLY_SHEET_DELAY_MIN:-10}
      # Cuánto sigue "caliente" un outcome a medio flujo antes de ceder la respuesta del
      # closer al Push 4 más reciente (§18.AC).
      - OUTCOME_REPLY_WINDOW_MIN=${OUTCOME_REPLY_WINDOW_MIN:-120}
      # Reporte diario de leads del Sheet (§18.B) — sin GOOGLE_SA_KEY o grupo el job se autodesactiva.
      - GOOGLE_SA_KEY=${GOOGLE_SA_KEY:-}
      - SHEETS_REPORT_GROUP=${SHEETS_REPORT_GROUP:-}
      - SHEETS_LEADS_ID=${SHEETS_LEADS_ID:-}
      - SHEETS_LEADS_TAB=${SHEETS_LEADS_TAB:-}
      # Estudiantes confirmados por cohorte (§18.B): lista `pestaña::rótulo` separada por
      # comas — conviven la cohorte en curso y la que se está vendiendo. Sin nada de esto,
      # la línea se omite. SHEETS_COHORT_TAB/LABEL es la config vieja de UNA sola cohorte
      # y sigue funcionando como fallback.
      - SHEETS_COHORTS=${SHEETS_COHORTS:-}
      - SHEETS_COHORT_TAB=${SHEETS_COHORT_TAB:-}
      - SHEETS_COHORT_LABEL=${SHEETS_COHORT_LABEL:-}
      - SHEETS_REPORT_CRON=${SHEETS_REPORT_CRON:-0 20 * * *}
      - SHEETS_SRC_AHEAD_HOURS=${SHEETS_SRC_AHEAD_HOURS:-3}
      # Pagos reales para el reporte de EstadoX (restricted key rk_… solo-lectura de
      # PaymentIntents). Sin key → fallback al tag manual del Sheet. Con permiso "read"
      # sobre Charges se suma además el bloque de VENTA NETA del mes (solo por DM).
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      # Payment Link del self-checkout (plink_…, NO la URL buy.stripe.com): con él, "pagos
      # self-checkout" se atribuye por link en vez del tag manual del Sheet. La rk_ necesita
      # permiso read sobre Checkout Sessions (el PaymentIntent no sabe de qué link vino).
      - STRIPE_SELF_CHECKOUT_PLINK=${STRIPE_SELF_CHECKOUT_PLINK:-}
      # Notificaciones a la admin de EstadoX (§18.AD): reporte diario por DM + aviso de pago
      # apenas Stripe lo confirma. Destinatarios = JIDs de WhatsApp (CSV) con hilo YA abierto
      # (Juanito nunca escribe en frío). El grupo "Ventas EstadoX" sigue APAGADO: lo corta
      # SHEETS_REPORT_GROUP_ENABLED, no el hecho de que SHEETS_REPORT_GROUP esté vacío.
      - SHEETS_REPORT_DM=${SHEETS_REPORT_DM:-}
      # Reporte ADMIN de EstadoX (§18.AD, 5 métricas): estos JIDs lo reciben EN LUGAR del
      # estándar de leads. Listas excluyentes — quien esté en ambas recibe los dos.
      - SHEETS_REPORT_ESTADOX_DM=${SHEETS_REPORT_ESTADOX_DM:-}
      - SHEETS_REPORT_GROUP_ENABLED=${SHEETS_REPORT_GROUP_ENABLED:-false}
      - STRIPE_ALERT_JIDS=${STRIPE_ALERT_JIDS:-}
      - STRIPE_ALERT_CRON=${STRIPE_ALERT_CRON:-*/5 * * * *}
      - STRIPE_ALERT_LOOKBACK_MIN=${STRIPE_ALERT_LOOKBACK_MIN:-120}
      # Reporte diario de MÉTRICAS de desempeño por DM (§18.N) — sin ID/TAB/recipients el job se autodesactiva.
      - SHEETS_METRICS_ID=${SHEETS_METRICS_ID:-}
      - SHEETS_METRICS_TAB=${SHEETS_METRICS_TAB:-}
      # Cada sección a su grupo (ya no por DM). Sin estos el job se autodesactiva.
      - SHEETS_METRICS_30X_GROUP=${SHEETS_METRICS_30X_GROUP:-}
      - SHEETS_METRICS_ESTADOX_GROUP=${SHEETS_METRICS_ESTADOX_GROUP:-}
      - SHEETS_METRICS_LINKEDIN_GROUP=${SHEETS_METRICS_LINKEDIN_GROUP:-}
      - SHEETS_METRICS_CRON=${SHEETS_METRICS_CRON:-0 20 * * *}
      # Reporte diario de "Registro de calls" (§18.AB) desde call_outcomes → grupo por
      # programa. ENABLED=false lo apaga (ej: durante un test acotado a un closer).
      - OUTCOME_REPORT_ENABLED=${OUTCOME_REPORT_ENABLED:-true}
      - OUTCOME_REPORT_CRON=${OUTCOME_REPORT_CRON:-0 22 * * *}
      # HubSpot (read-only PAK): fill de teléfono precall + modelo nudge (§18.AF).
      # Sin HUBSPOT_PAT los helpers se autodesactivan (isEnabled()=false → comportamiento
      # previo). NUDGE_ENABLED off por default: se prende aparte tras validar el deploy.
      - HUBSPOT_PAT=${HUBSPOT_PAT:-}
      - HUBSPOT_ENABLED=${HUBSPOT_ENABLED:-}
      - HUBSPOT_PORTAL_ID=${HUBSPOT_PORTAL_ID:-50929115}
      - HUBSPOT_NUDGE_ENABLED=${HUBSPOT_NUDGE_ENABLED:-false}
      # Cosecha por agenda_status (§18.AG) — evolución del nudge: en vez de picar al closer
      # por la etapa del deal, deriva el outcome directo de agenda_status. Off por default,
      # mismo patrón que NUDGE_ENABLED arriba (se prende aparte tras validar el deploy).
      - HUBSPOT_AGENDA_HARVEST=${HUBSPOT_AGENDA_HARVEST:-false}
      - HUBSPOT_PROGRAM_PIPELINES=${HUBSPOT_PROGRAM_PIPELINES:-}
      # Barrido periódico de cosecha (§18.AH): re-consulta HubSpot para filas que cayeron
      # al nudge y cerraron como 'no_answer' antes de que el closer alcanzara a actualizar
      # el deal. ON por default en cuanto HARVEST está prendido (ver .env.example).
      - HUBSPOT_HARVEST_SWEEP_ENABLED=${HUBSPOT_HARVEST_SWEEP_ENABLED:-true}
      - HUBSPOT_HARVEST_SWEEP_CRON=${HUBSPOT_HARVEST_SWEEP_CRON:-0 8-22/2 * * *}
      - HUBSPOT_HARVEST_SWEEP_MAX_AGE_HOURS=${HUBSPOT_HARVEST_SWEEP_MAX_AGE_HOURS:-72}
      - HUBSPOT_AGENDA_POLL=${HUBSPOT_AGENDA_POLL:-false}
      - HUBSPOT_RESCHEDULE_SCAN=${HUBSPOT_RESCHEDULE_SCAN:-true}
      - HUBSPOT_RESCHEDULE_LOOKBACK_MIN=${HUBSPOT_RESCHEDULE_LOOKBACK_MIN:-120}
      # Conteo de setteos por closer (§18.AI): leads TOCADOS sin cita, read-only. /setteos
      # on-demand corre siempre; SETTEO_REPORT_ENABLED off por default solo gatea el anexo al
      # reporte del jefe. SETTEO_REPORT_CLOSERS vacío → cae al scope del nudge (PUSH4_CLOSERS).
      - SETTEO_REPORT_ENABLED=${SETTEO_REPORT_ENABLED:-false}
      - SETTEO_REPORT_CLOSERS=${SETTEO_REPORT_CLOSERS:-}
      # Setteo REPORTADO por el closer (§18.AZ): él se lo cuenta a Juanito por WhatsApp, se
      # guarda en SQLite y se cruza con HubSpot (read-only). Le da /missetteos con las tres
      # cifras (reportado / registrado en HubSpot / cuota por horas libres) y su propio
      # contexto agéntico. Con SETTEO_CAPTURE_ENABLED=false, un closer ve lo mismo que hoy.
      - SETTEO_CAPTURE_ENABLED=${SETTEO_CAPTURE_ENABLED:-false}
      - SETTEO_CAPTURE_CLOSERS=${SETTEO_CAPTURE_CLOSERS:-}
      - SETTEO_AI_FALLBACK=${SETTEO_AI_FALLBACK:-true}
      - SETTEO_AI_MODEL=${SETTEO_AI_MODEL:-claude-haiku-4-5-20251001}
      - SETTEO_AI_TIMEOUT_MS=${SETTEO_AI_TIMEOUT_MS:-8000}
      # Modelo SOLO para el DM de un closer (§18.BE). Sus tres tools ESCRIBEN, y distinguir
      # "toqué a Juan" de "borrá el de Juan" es donde un modelo flojo cuesta caro: le crea un
      # lead fantasma. Vacío = cae a CLAUDE_MODEL, o sea el comportamiento de antes.
      - CLAUDE_CLOSER_MODEL=${CLAUDE_CLOSER_MODEL:-}
      # Identidad de PRUEBA para el smoke del setteo (§18.BB). Agrega un closer desechable al
      # roster — el smoke necesita que una persona real escriba, y el rol sale del JID. Apagada
      # por default; terminar la prueba es volver a false, sin deploy. Ver src/calendly/closers.js.
      # ⚠️ No basta con prenderla: su LID tiene que salir de ADMIN_LID o roleOf() la ve admin.
      - TEST_CLOSER_ENABLED=${TEST_CLOSER_ENABLED:-false}
      - SETTEO_CUOTA_POR_HORA=${SETTEO_CUOTA_POR_HORA:-15}
      - SETTEO_JORNADA_INICIO=${SETTEO_JORNADA_INICIO:-8}
      - SETTEO_JORNADA_FIN=${SETTEO_JORNADA_FIN:-17}
      - SETTEO_MINUTOS_POR_CALL=${SETTEO_MINUTOS_POR_CALL:-60}
      - CLOSER_DAILY_LIMIT=${CLOSER_DAILY_LIMIT:-60}
      # Los 3 reportes diarios por DM (§18.AL): agenda 7am · progreso 12pm · cierre 9pm.
      # Off por default; se prende con DAILY_REPORTS_ENABLED + al menos un DM destino.
      - DAILY_REPORTS_ENABLED=${DAILY_REPORTS_ENABLED:-false}
      - DAILY_REPORTS_DM=${DAILY_REPORTS_DM:-}
      - DAILY_REPORT_AM_CRON=${DAILY_REPORT_AM_CRON:-0 7 * * *}
      - DAILY_REPORT_MID_CRON=${DAILY_REPORT_MID_CRON:-0 12 * * *}
      - DAILY_REPORT_PM_CRON=${DAILY_REPORT_PM_CRON:-0 21 * * *}
      # QR web server — solo durante la vinculación inicial.
      # Descomentar la línea de abajo y agregar QR_PORT=3001 al .env.
      # Volver a comentar una vez vinculado.
      # - QR_PORT=${QR_PORT:-}
    # ports:
    #   - "${QR_PORT:-3001}:${QR_PORT:-3001}"
    volumes:
      - agent-data:/app/data

  # ─── Dashboard de operación (docs/DASHBOARD-ROADMAP.md · ADR 0002) ──────────
  #
  # Contenedor APARTE del bot a propósito: src/index.js hace process.exit(1) ante
  # cualquier excepción no capturada y entrypoint.sh duerme 30-300s, así que un bug
  # HTTP dentro del bot tumbaría WhatsApp hasta 5 minutos.
  #
  # Reusa la MISMA imagen ya construida (sin `build:`) → levantarlo no dispara una
  # compilación en el único vCPU del droplet. El código del dashboard se monta desde
  # el host, así que iterarlo NO reconstruye la imagen ni reinicia el bot.
  dash:
    image: juanito-agent:latest
    container_name: juanito-dash
    restart: unless-stopped
    command: node dashboard/server/index.js
    # Sin depends_on a propósito: el dashboard tiene que servir JUSTO cuando el bot
    # está caído, que es cuando hace falta mirarlo.
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-America/Bogota}
      - DB_PATH=/app/data/brain.sqlite
      - DASH_PORT=8080
      # Destinatarios de las alertas: los mismos LIDs del equipo dev.
      - ADMIN_LID=${ADMIN_LID:-}
      # Arranca APAGADO: el watchdog solo escribe al dashboard hasta medir volumen.
      # El handoff §18.AZ avisa que estas alertas compiten con el anti-ban.
      - DASH_ALERTS_WHATSAPP=${DASH_ALERTS_WHATSAPP:-false}
      - DASH_WATCHDOG_MIN=${DASH_WATCHDOG_MIN:-15}
      - DASH_ALERT_DEDUP_HOURS=${DASH_ALERT_DEDUP_HOURS:-6}
      # Para que el check de respuestas vencidas use el mismo TTL que el bot.
      - REPLY_APPROVAL_TTL_MIN=${REPLY_APPROVAL_TTL_MIN:-30}
      # Escrituras por tab (F2). Vacío = dashboard de solo lectura, o sea F1 tal cual.
      # Lista de tabs (aprobaciones,grupos,programados,outreach,tareas,negocio,
      # recordatorios,toggles) o `todo`. Cambiarlo solo recrea `dash`, no toca al bot.
      - DASH_WRITES=${DASH_WRITES:-}
      # PAT de GitHub con `actions:write` para el botón Deploy. Sin él la ruta no existe
      # y la UI no lo dibuja. El repo y la rama tienen default correcto en deploy.js.
      - DASH_GITHUB_TOKEN=${DASH_GITHUB_TOKEN:-}
      # Mismo gate que el bot (§18.BB). Va acá para que el tab de registries muestre el MISMO
      # roster que ejecuta el bot: un dashboard que contradice al proceso que audita es peor
      # que no tenerlo — es la clase de dato falso que este panel existe para eliminar.
      - TEST_CLOSER_ENABLED=${TEST_CLOSER_ENABLED:-false}
    ports:
      # NUNCA 0.0.0.0, y ni siquiera la interfaz del tailnet: el puerto escucha SOLO en
      # loopback. Quien lo publica es `tailscale serve`, que proxea
      # https://juanito.<tailnet>.ts.net → 127.0.0.1:8080 con TLS real.
      #
      # Así el puerto no está expuesto ni a internet ni al tailnet: solo tailscaled, que
      # corre en el propio host, puede alcanzarlo. La regla de no exponer puertos, que
      # nació de un softban, se mantiene intacta.
      #
      # DASH_BIND existe como escape: apuntándolo a la IP 100.x del nodo se llega por
      # http://<ip>:8080 sin Serve (útil si Serve o los certs se caen). Default seguro.
      - "${DASH_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - agent-data:/app/data
      # Solo lectura: el dashboard nunca reescribe su propio código.
      - ./dashboard:/app/dashboard:ro
    # Aislamiento por contrato, no por confianza: el bot vive en ~80 MB de los 1967
    # del droplet y bajo contención de CPU gana él.
    mem_limit: 256m
    cpu_shares: 512

volumes:
  agent-data:
    driver: local
