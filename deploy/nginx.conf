# deploy/nginx.conf
# Reverse proxy HTTPS para el Second Brain Agent.
# Meta exige HTTPS para los webhooks; nginx termina TLS y reenvía a localhost.
#
# Uso:
#   1) sudo cp deploy/nginx.conf /etc/nginx/sites-available/second-brain
#   2) editar server_name y, si cambiaste AGENT_PORT, el puerto del proxy_pass
#   3) sudo ln -s /etc/nginx/sites-available/second-brain /etc/nginx/sites-enabled/
#   4) sudo certbot --nginx -d tudominio.com   (emite/renueva el certificado)
#   5) sudo nginx -t && sudo systemctl reload nginx
#
# NOTA: el otro bot del VPS debe usar su propio server_name / puerto. Este bloque
# solo enruta el dominio del agente, así no interfiere con servicios existentes.

upstream second_brain_agent {
    # Debe coincidir con AGENT_PORT del .env (compose publica en 127.0.0.1:AGENT_PORT)
    server 127.0.0.1:3000;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name tudominio.com;          # <-- CAMBIAR
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tudominio.com;          # <-- CAMBIAR

    # Certificados (los gestiona certbot)
    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;   # <-- CAMBIAR
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;     # <-- CAMBIAR

    # Webhook de Meta (verificación GET + mensajes POST)
    location /webhook/meta {
        proxy_pass http://second_brain_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook de OpenWA
    location /webhook/openwa {
        proxy_pass http://second_brain_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://second_brain_agent;
        access_log off;
    }

    # Todo lo demás: 404 (no exponemos otras rutas)
    location / {
        return 404;
    }
}
